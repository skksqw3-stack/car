
name: Godot Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

      - name: Accept SDK licenses and install packages
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-33"
          "$SDKMANAGER" --install "build-tools;33.0.2"

      - name: Download Godot 4.2.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip -q Godot_v4.2.2-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/. ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: Check project files
        run: |
          if [ ! -f project.godot ]; then
            echo "ERROR: project.godot not found in repository root"
            exit 1
          fi

          if [ ! -f export_presets.cfg ]; then
            echo "ERROR: export_presets.cfg not found"
            exit 1
          fi

      - name: Configure Godot Android SDK
        run: |
          mkdir -p ~/.config/godot
          godot --headless --editor --path . --quit

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/car.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Car-Android-APK
          path: build/car.apk
          if-no-files-found: error
