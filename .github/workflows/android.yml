
name: Godot Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip p7zip-full

      - name: Extract project
        shell: bash
        run: |
          mkdir -p extracted

          if [ -f "New folder (8).zip" ]; then
            7z x "New folder (8).zip" -oextracted -y
          else
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          PROJECT_FILE=$(find extracted -name project.godot -type f -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Install Godot 4.2.2
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.2.2-stable_linux.x86_64

          sudo mv godot-bin/Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Install Windows export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz \
            -O templates.tpz

          mkdir templates
          unzip -q templates.tpz -d templates

          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"

          cp -a templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.2.2.stable/"

      - name: Import project
        run: |
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export Windows EXE
        run: |
          mkdir -p build

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-release "Windows Desktop" \
            build/Car.exe

          test -f build/Car.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Car-Windows-EXE
          path: build/
