
name: Godot Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Godot project
        id: project
        run: |
          PROJECT_FILE=$(find . -type f -name "project.godot" -not -path "*/.godot/*" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No project.godot found in repository"
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -n 150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project: $PROJECT_FILE"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-33"
          "$SDKMANAGER" --install "build-tools;33.0.2"

      - name: Download Godot 4.2.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip -q Godot_v4.2.2-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/. ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: Check export preset
        run: |
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg not found in $PROJECT_DIR"
            exit 1
          fi

          cat "$PROJECT_DIR/export_presets.cfg"

      - name: Export APK
        run: |
          mkdir -p "$PROJECT_DIR/build"
          godot --headless --editor --path "$PROJECT_DIR" --quit
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/car.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Car-Android-APK
          path: "**/build/car.apk"
          if-no-files-found: error
