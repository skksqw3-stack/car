
      - name: Diagnose Android Export
        run: |
          echo "===== GODOT VERSION ====="
          godot --version

          echo "===== PROJECT SETTINGS ====="
          cat "$PROJECT_DIR/project.godot"

          echo "===== EXPORT PRESET ====="
          cat "$PROJECT_DIR/export_presets.cfg"

          echo "===== SDK SETTINGS ====="
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/ndk"

          echo "===== JAVA ====="
          java -version

          echo "===== KEYSTORE ====="
          keytool -list \
            -keystore ~/.android/debug.keystore \
            -storepass android

          echo "===== GODOT EXPORT ====="
          mkdir -p build

          godot --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "Android" build/Car.apk \
            2>&1 | tee build/export-log.txt || true

          echo "===== EXPORT LOG ====="
          grep -i -E "error|missing|invalid|android|sdk|ndk|keystore|template" \
            build/export-log.txt || true

      - name: Upload Diagnostic Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Diagnostic
          path: |
            build/export-log.txt
            extracted/**/export_presets.cfg
          if-no-files-found: warn
