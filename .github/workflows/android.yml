
name: Extract and Build Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'New folder (8).*'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip

      - name: Extract split ZIP archive
        run: |
          mkdir -p extracted
          7z x "New folder (8).zip" -oextracted -y
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Godot project
        id: project
        run: |
          PROJECT_FILE=$(find extracted -name project.godot -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Godot project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Download Godot 4.2.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip -q Godot_v4.2.2-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: Configure Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Godot project
        run: |
          godot --headless --editor --path "${{ steps.project.outputs.path }}" --quit

      - name: Build Android APK
        run: |
          mkdir -p output
          godot --headless --path "${{ steps.project.outputs.path }}" \
            --export-debug "Android" "$GITHUB_WORKSPACE/output/Game.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Android-APK
          path: output/Game.apk
          if-no-files-found: error
