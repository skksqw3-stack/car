
name: Godot APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK without setup-android action
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract project
        run: |
          mkdir -p extracted
          7z x "New folder (8).zip" -y -oextracted

          PROJECT_FILE=$(find extracted -type f -name project.godot | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Godot project not found"
            find extracted -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> $GITHUB_ENV

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip -q Godot_v4.2.2-stable_export_templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/. ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: Export APK
        run: |
          test -f "$PROJECT_DIR/export_presets.cfg"
          mkdir -p build
          godot --headless --editor --path "$PROJECT_DIR" --quit
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" build/car.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Car-APK
          path: build/car.apk
          if-no-files-found: error
